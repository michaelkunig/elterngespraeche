.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;transition:background .3s;flex-shrink:0}
.sync-dot.live{background:#4caf50}
.sync-dot.err{background:#e53935}
.sync-dot.loading{background:#ffa726;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
